# 工作流名称
name: Deploy to Cloudflare

# 触发条件
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 新增一个 job 用于检查密钥是否存在
  check_credentials:
    runs-on: ubuntu-latest
    name: Check for Cloudflare Credentials
    outputs:
      has_creds: ${{ steps.cf_creds.outputs.has_creds }}
    steps:
      - name: Check for Cloudflare credentials
        id: cf_creds
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ] || [ -z "${{ secrets.CF_ACCOUNT_ID }}" ]; then
            echo "Cloudflare credentials not found, skipping deployment."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          else
            echo "Cloudflare credentials found."
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

  # 部署 job，依赖于 check_credentials job 的结果
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: check_credentials # 依赖于上一个 job
    if: needs.check_credentials.outputs.has_creds == 'true' # 只有在密钥存在时才运行
    steps:
      # 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 设置 pnpm (版本由根目录 package.json 的 "packageManager" 字段决定)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate, migrate and deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          EMAIL_DOMAIN: ${{ secrets.EMAIL_DOMAIN }}
          TURNSTILE_KEY: ${{ secrets.TURNSTILE_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_RATE_LIMIT_PER_MINUTE: ${{ secrets.API_RATE_LIMIT_PER_MINUTE }}
          SHOW_AFF: ${{ secrets.SHOW_AFF }}
          ENABLE_OPENAPI: ${{ secrets.ENABLE_OPENAPI }}
          SEND_CHANNEL: ${{ secrets.SEND_CHANNEL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SEND_USER_DAILY_LIMIT: ${{ vars.SEND_USER_DAILY_LIMIT }}
          SEND_GLOBAL_DAILY_LIMIT: ${{ vars.SEND_GLOBAL_DAILY_LIMIT }}
          SEND_RATE_LIMIT_PER_MINUTE: ${{ secrets.SEND_RATE_LIMIT_PER_MINUTE }}
          SEND_IP_RATE_LIMIT_PER_MINUTE: ${{ secrets.SEND_IP_RATE_LIMIT_PER_MINUTE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAILCHANNELS_API_KEY: ${{ secrets.MAILCHANNELS_API_KEY }}
          MAILBOX_TOKEN_SECRET: ${{ secrets.MAILBOX_TOKEN_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          API_DAILY_LIMIT: ${{ secrets.API_DAILY_LIMIT }}
          MAILBOX_DAILY_LIMIT: ${{ secrets.MAILBOX_DAILY_LIMIT }}
          MAX_ACTIVE_MAILBOXES: ${{ secrets.MAX_ACTIVE_MAILBOXES }}
          GLOBAL_API_DAILY_LIMIT: ${{ secrets.GLOBAL_API_DAILY_LIMIT }}
          GLOBAL_INBOUND_DAILY_LIMIT: ${{ secrets.GLOBAL_INBOUND_DAILY_LIMIT }}
          MAILBOX_INBOUND_DAILY_LIMIT: ${{ secrets.MAILBOX_INBOUND_DAILY_LIMIT }}
          MAX_EMAIL_BYTES: ${{ secrets.MAX_EMAIL_BYTES }}
          SUSPEND_DATABASE_ACCESS: ${{ secrets.SUSPEND_DATABASE_ACCESS }}
